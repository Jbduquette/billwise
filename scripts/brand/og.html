<!doctype html>
<!-- 1200×630 social preview card (Open Graph / Twitter), in the Editorial Ledger style. Rendered by generate-brand.mjs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 100 900; src: url("../../public/fonts/fraunces.woff2") format("woff2"); }
      @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("../../public/fonts/fraunces-italic.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../../public/fonts/instrument-sans.woff2") format("woff2"); }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { background: #f2ede3; color: #1b1916; font-family: "Instrument Sans", sans-serif; padding: 0 72px; box-sizing: border-box; position: relative; }
      .sc { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #6b6358; }
      .mast { height: 104px; display: flex; align-items: center; }
      .wm { font-family: "Fraunces", serif; font-style: italic; font-weight: 480; font-size: 40px; letter-spacing: -0.02em; }
      .mast .sc { margin-left: auto; }
      .dbl { height: 7px; border-top: 2px solid #1b1916; border-bottom: 1px solid #1b1916; }
      .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: center; margin-top: 40px; }
      h1 { margin: 16px 0 0; font-family: "Fraunces", serif; font-weight: 350; font-size: 78px; line-height: 0.98; letter-spacing: -0.035em; }
      h1 b { font-weight: 520; font-variant-numeric: lining-nums; }
      h1 em { font-weight: 300; }
      p.deck { margin: 22px 0 0; font-family: "Fraunces", serif; font-style: italic; font-weight: 350; font-size: 25px; line-height: 1.4; color: #4a453d; }
      p.deck span { color: #a53b26; }
      .split { display: flex; height: 12px; margin-top: 30px; width: 460px; }
      .split .p { width: 95%; background: #4a6236; }
      .split .u { flex: 1; border: 1.5px solid #1b1916; border-left: 0; background: repeating-linear-gradient(135deg, #1b1916 0 1.3px, transparent 1.3px 4.5px); }
      svg { width: 100%; }
    </style>
  </head>

    <div class="dbl"></div>
    <div class="grid">
      <div>
        <span class="sc">No. 09 — The month in brief</span>
        <h1>You owe <b>$3,208.74</b> <em>in September.</em></h1>
        <p class="deck">Nine of twelve bills are settled. <span>One is late</span>; the rest can wait until Wednesday.</p>
        <div class="split"><div class="p"></div><div class="u"></div></div>
      </div>

</html>
